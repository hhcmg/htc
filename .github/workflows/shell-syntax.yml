name: Shell syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n vps-egress-limit.sh

      - name: Check help command
        run: bash vps-egress-limit.sh --help >/dev/null

      - name: Test CLI parsing
        run: bash tests/test-cli.sh
